<!DOCTYPE html>
<html>
<head>
    <title>Glow X and O - Real-Time Multiplayer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            cursor: pointer;
            flex-direction: column;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        canvas {
            border: 2px solid #ffffff;
            display: block;
            box-shadow: 0 0 20px #ffffff;
        }

        .info {
            color: #ffffff;
            font-size: 18px;
            text-align: center;
            margin: 10px 0;
        }

        .winner-message {
            font-size: 24px;
            color: #f39c12;
            text-shadow: 0 0 10px #f39c12, 0 0 20px #e67e22;
            margin: 20px;
        }

        .profile-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 20px;
        }

        #turnInfo {
            font-size: 20px;
            font-weight: bold;
            margin: 10px;
        }

        #timer {
            font-size: 30px;
            font-weight: bold;
            margin: 10px;
            text-shadow: 0 0 10px #ff4d4d;
            transition: transform 0.2s ease-in-out;
        }

        .shake {
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        #joinRoom {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            background-color: #333;
            color: white;
            border: 1px solid #00ffcc;
            padding: 10px;
            border-radius: 5px;
            width: 200px;
            font-size: 16px;
        }

        button {
            background-color: #00ffcc;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #00e6b8;
            box-shadow: 0 0 15px #00ffcc;
        }

        #roomCodeDisplay {
            color: #00ffcc;
            font-size: 24px;
            margin: 20px 0;
            padding: 15px;
            border: 2px solid #00ffcc;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.5);
            text-align: center;
            box-shadow: 0 0 15px #00ffcc;
        }

        #gameBoard {
            display: none;
        }

        #playerInfo {
            color: #00ffcc;
            font-size: 18px;
            margin: 10px 0;
            text-align: center;
        }

        #waitingMessage {
            font-size: 24px;
            color: #00ffcc;
            text-align: center;
            margin: 20px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        #startScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #title {
            font-size: 48px;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .button-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        #shareText {
            color: #ffffff;
            font-size: 16px;
            margin-top: 10px;
        }
        
        #connectionStatus {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: #fff;
            padding: 5px;
            border-radius: 3px;
            font-size: 12px;
        }
        
        #serverUrl {
            margin-top: 10px;
            display: none; /* Hide the server URL input by default */
            flex-direction: column;
            align-items: center;
        }
        
        #serverInput {
            margin-bottom: 10px;
            width: 300px;
        }
        
        /* Game end dialog styles */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }
        
        .dialog-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .dialog-box {
            background-color: #222;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 30px #00ffcc;
            text-align: center;
            width: 350px;
            max-width: 90%;
        }
        
        .dialog-title {
            font-size: 28px;
            color: #00ffcc;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ffcc;
        }
        
        .dialog-message {
            font-size: 18px;
            margin-bottom: 25px;
            color: #fff;
        }
        
        .dialog-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .dialog-box button {
            min-width: 120px;
            font-size: 16px;
        }
        
        .decline-btn {
            background-color: #ff4d4d;
        }
        
        .decline-btn:hover {
            background-color: #ff3333;
            box-shadow: 0 0 15px #ff4d4d;
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <div id="title">Glow X and O</div>
        
        <div id="serverUrl">
            <input type="text" id="serverInput" value="http://localhost:3000" placeholder="Socket.io server URL">
            <button id="connectBtn">Connect to Server</button>
        </div>
        
        <div class="button-container" style="display: none;">
            <button id="createRoomBtn">Create Game</button>
            <button id="joinRoomBtnToggle">Join Game</button>
        </div>
        <div id="joinRoom" style="display: none;">
            <input type="text" id="roomCodeInput" placeholder="Enter room code">
            <button id="joinRoomBtn">Join</button>
        </div>
        <div id="roomCodeDisplay" style="display: none;"></div>
        <div id="shareText" style="display: none;">Share this code with your opponent</div>
        <div id="waitingMessage" style="display: none;">Waiting for opponent...</div>
    </div>
    
    <div id="gameBoard">
        <div id="playerInfo"></div>
        <div id="gameContainer">
            <div class="profile-container">
                <div id="playerXScore" class="info">Player X: 0</div>
                <div id="turnInfo">Player X's Turn</div>
                <div id="playerOScore" class="info">Player O: 0</div>
            </div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="timer">25</div>
            <div id="winnerMessage" class="winner-message" style="display: none;">Winner: Player X</div>
        </div>
    </div>
    
    <!-- Game End Dialog -->
    <div id="gameEndDialog" class="dialog-overlay">
        <div class="dialog-box">
            <div class="dialog-title">Game Over</div>
            <div id="gameEndMessage" class="dialog-message">Player X wins!</div>
            <div class="dialog-buttons">
                <button id="rematchBtn" class="rematch-btn">Rematch</button>
                <button id="quitBtn" class="decline-btn">Quit</button>
            </div>
        </div>
    </div>
    
    <!-- Rematch Request Dialog -->
    <div id="rematchRequestDialog" class="dialog-overlay">
        <div class="dialog-box">
            <div class="dialog-title">Rematch Request</div>
            <div class="dialog-message">Your opponent wants a rematch.</div>
            <div class="dialog-buttons">
                <button id="acceptRematchBtn">Accept</button>
                <button id="declineRematchBtn" class="decline-btn">Decline</button>
            </div>
        </div>
    </div>
    
    <div id="connectionStatus">Not connected</div>

    <!-- Include Socket.io client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
