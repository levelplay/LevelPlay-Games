<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glow Snake Multiplayer - Rooms</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            box-sizing: border-box;
            overflow-x: hidden;
            color: white;
        }
        
        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            background-color: #252525;
            border-radius: 16px;
            border: 4px solid #555;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }
        
        h1 {
            font-size: clamp(28px, 5vw, 48px);
            margin-bottom: 20px;
            color: #33ff33;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.7);
        }
        
        p {
            font-size: clamp(16px, 3vw, 20px);
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .button-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 40px;
        }
        
        .big-button {
            padding: 15px 25px;
            width: 40%;
            font-size: clamp(16px, 3vw, 22px);
            background: linear-gradient(45deg, #33cc33, #27ae60);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }
        
        .big-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.6);
        }
        
        .form-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }
        
        input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 18px;
            border: 2px solid #33cc33;
            background-color: #333;
            color: white;
            border-radius: 8px;
            text-align: center;
        }
        
        .action-button {
            padding: 12px 25px;
            font-size: 18px;
            background: linear-gradient(45deg, #33cc33, #27ae60);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .action-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }
        
        .game-code {
            font-size: 28px;
            font-weight: bold;
            color: #33ff33;
            margin: 20px 0;
            padding: 15px;
            background-color: #333;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }
        
        .copy-button {
            padding: 8px 15px;
            font-size: 16px;
            background: linear-gradient(45deg, #3366cc, #2980b9);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin-bottom: 30px;
            transition: all 0.2s;
        }
        
        .copy-button:hover {
            transform: scale(1.05);
        }
        
        .status-message {
            font-size: 18px;
            margin: 20px 0;
            color: #ffff55;
            font-weight: bold;
        }
        
        .error-message {
            color: #ff5555;
            margin: 10px 0;
            font-weight: bold;
            display: none;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(0, 255, 0, 0.4); }
            50% { box-shadow: 0 0 25px rgba(0, 255, 0, 0.7); }
            100% { box-shadow: 0 0 15px rgba(0, 255, 0, 0.4); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 15px;
            }
            
            .button-container {
                flex-direction: column;
                align-items: center;
            }
            
            .big-button {
                width: 80%;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Glow Snake Multiplayer</h1>
        <p>Challenge your friends in a glowing snake duel! Create a game room or join an existing one with a room code.</p>
        
        <div class="button-container">
            <button id="createButton" class="big-button">Create Game</button>
            <button id="joinButton" class="big-button">Join Game</button>
        </div>
        
        <!-- Create Game Form -->
        <div id="createForm" class="form-container">
            <div class="status-message">Your game room code:</div>
            <div id="gameCode" class="game-code pulse"></div>
            <button id="copyButton" class="copy-button">Copy Code</button>
            <div class="status-message">Waiting for opponent to join...</div>
            <button id="startGameButton" class="action-button">Start Game</button>
        </div>
        
        <!-- Join Game Form -->
        <div id="joinForm" class="form-container">
            <div class="status-message">Enter the room code to join:</div>
            <input type="text" id="roomCodeInput" placeholder="Enter room code" maxlength="8">
            <div id="joinError" class="error-message">Invalid room code. Please try again.</div>
            <button id="joinGameButton" class="action-button">Join Game</button>
        </div>
    </div>
    
    <script>
        // Connect to Socket.io server
        const socket = io();
        let roomCode = null;
        
        // DOM elements
        const createButton = document.getElementById('createButton');
        const joinButton = document.getElementById('joinButton');
        const createForm = document.getElementById('createForm');
        const joinForm = document.getElementById('joinForm');
        const gameCodeElement = document.getElementById('gameCode');
        const copyButton = document.getElementById('copyButton');
        const roomCodeInput = document.getElementById('roomCodeInput');
        const joinGameButton = document.getElementById('joinGameButton');
        const startGameButton = document.getElementById('startGameButton');
        const joinError = document.getElementById('joinError');
        
        // Debug flag
        const DEBUG = true;
        
        function debugLog(...args) {
            if (DEBUG) {
                console.log(...args);
            }
        }
        
        // Show create game form
        createButton.addEventListener('click', () => {
            createForm.style.display = 'flex';
            joinForm.style.display = 'none';
            
            // Generate a room code (using first 8 chars of UUID v4)
            roomCode = uuid.v4().substring(0, 8);
            gameCodeElement.textContent = roomCode;
            
            // Create a room on the server
            socket.emit('createRoom', { roomCode });
            
            debugLog('Created room:', roomCode);
        });
        
        // Show join game form
        joinButton.addEventListener('click', () => {
            joinForm.style.display = 'flex';
            createForm.style.display = 'none';
        });
        
        // Copy room code
        copyButton.addEventListener('click', () => {
            navigator.clipboard.writeText(roomCode).then(() => {
                copyButton.textContent = 'Copied!';
                setTimeout(() => {
                    copyButton.textContent = 'Copy Code';
                }, 2000);
            });
        });
        
        // Join a game
        joinGameButton.addEventListener('click', () => {
            const code = roomCodeInput.value.trim();
            
            if (code.length < 1) {
                joinError.textContent = 'Please enter a room code.';
                joinError.style.display = 'block';
                return;
            }
            
            roomCode = code;
            socket.emit('joinRoom', { roomCode });
            
            debugLog('Attempting to join room:', roomCode);
        });
        
        // Start game button (after creating a room)
        startGameButton.addEventListener('click', () => {
            if (roomCode) {
                window.location.href = '/game.html?room=' + roomCode;
            }
        });
        
        // Socket events
        socket.on('connect', () => {
            debugLog('Connected to server with ID:', socket.id);
        });
        
        // Room created successfully
        socket.on('roomCreated', (data) => {
            debugLog('Room created successfully:', data);
        });
        
        // When someone joins the room
        socket.on('playerJoinedRoom', (data) => {
            debugLog('Player joined room:', data);
            
            // If we're the host, we can now start the game
            if (createForm.style.display === 'flex') {
                startGameButton.classList.add('pulse');
                document.querySelector('#createForm .status-message').textContent = 'Opponent joined! Ready to start the game.';
            }
        });
        
        // Room join response
        socket.on('roomJoined', (data) => {
            debugLog('Successfully joined room:', data);
            
            // Redirect to game page
            window.location.href = '/game.html?room=' + roomCode;
        });
        
        // Room join error
        socket.on('roomError', (data) => {
            debugLog('Room error:', data);
            joinError.textContent = data.message;
            joinError.style.display = 'block';
        });
    </script>
</body>
</html>
