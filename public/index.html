<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Pong</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.55.2/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        
        #game-container {
            position: relative;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0, 0, 255, 0.3);
            overflow: hidden;
            width: 800px;
            height: 600px;
            max-width: 100%;
            max-height: 100vh;
        }
        
        #status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0); /* Transparent background */
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 20px;
            z-index: 1000;
            letter-spacing: 1px;
            border: none; /* Removed border */
            text-align: center;
        }
        
        #game {
            border-radius: 10px;
            width: 100%;
            height: 100%;
        }
        
        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .menu-content {
            background: rgba(22, 33, 62, 0.95);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 30px rgba(0, 0, 255, 0.2);
            max-width: 400px;
            width: 80%;
            margin: 20px;
        }
        
        h1 {
            color: #fff;
            margin-top: 0;
            font-size: 32px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        h2 {
            margin-top: 0;
            font-size: 24px;
            color: #fff;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        button {
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 200px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        input {
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            width: 100%;
            max-width: 250px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
            box-sizing: border-box;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .game-code {
            font-size: 28px;
            letter-spacing: 5px;
            color: #4cc9f0;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid rgba(76, 201, 240, 0.3);
            word-break: break-all;
        }
        
        .instructions {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.5;
        }
        
        .hidden {
            display: none;
        }
        
        #copy-code {
            background: linear-gradient(45deg, #0077b6, #00b4d8);
        }
        
        #error-message {
            color: #ef476f;
            margin-top: 15px;
            font-size: 16px;
        }
        
        /* Mobile-specific adjustments */
        @media (max-width: 480px) {
            .menu-content {
                padding: 25px 15px;
                width: 90%;
            }
            
            h1 {
                font-size: 24px;
            }
            
            h2 {
                font-size: 20px;
            }
            
            button {
                padding: 10px 20px;
                font-size: 16px;
            }
            
            input {
                padding: 10px 15px;
                font-size: 16px;
            }
            
            .game-code {
                font-size: 22px;
                padding: 10px;
            }
        }

        /* Mobile touch controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1500;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .mobile-control-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-control-btn:active {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
            color: rgba(255, 255, 255, 1);
            transform: scale(0.95);
        }

        .mobile-control-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="status">Connecting...</div>
        <div id="game"></div>
        
        <!-- Main Menu Overlay -->
        <div id="menu-overlay">
            <div class="menu-content">
                <h1>Modern Pong</h1>
                
                <!-- Main Menu -->
                <div id="main-menu">
                    <div class="button-group">
                        <button id="create-game-btn">Create Game</button>
                        <button id="join-game-btn">Join Game</button>
                    </div>
                </div>
                
                <!-- Create Game Screen -->
                <div id="create-game-screen" class="hidden">
                    <h2>Game Created!</h2>
                    <p>Share this code with your friend:</p>
                    <div class="game-code" id="game-code-display">------</div>
                    <button id="copy-code">Copy Code</button>
                    <p class="instructions">Waiting for opponent to join...</p>
                </div>
                
                <!-- Join Game Screen -->
                <div id="join-game-screen" class="hidden">
                    <h2>Join Game</h2>
                    <p>Enter the game code:</p>
                    <input type="text" id="game-code-input" placeholder="ENTER CODE" maxlength="6">
                    <div class="button-group">
                        <button id="join-btn">Join</button>
                        <button id="back-btn">Back</button>
                    </div>
                    <div id="error-message"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Mobile Touch Controls -->
    <div id="mobile-controls">
        <div class="mobile-control-btn" id="mobile-up">▲</div>
        <div class="mobile-control-btn" id="mobile-down">▼</div>
    </div>
    
    <!-- Game Scripts -->
    <script src="pongScene.js"></script>
    <script src="game.js"></script>
</body>
</html>
